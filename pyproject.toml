[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-ai-mediation"
version = "0.1.0"
description = "Code for transformation-effect and deactivation experiments."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2",
  "networkx>=3",
  "pyyaml>=6",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
polar-run-suite = "polar_ai.experiments.run_suite:main"
polar-run-transformation-effect = "polar_ai.experiments.run_transformation_effect:main"
polar-run-deactivation = "polar_ai.experiments.run_deactivation:main"
polar-run-polarization-decomposition = "polar_ai.experiments.run_polarization_decomposition:main"
polar-plot-results = "polar_ai.experiments.plot_results:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
